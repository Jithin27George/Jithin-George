<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Hexy: Media</title>

  <link 
    href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" 
    rel="stylesheet"
  />
  
  <style>
    /* 1. Make the page a column flex container, filling viewport */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;            /* no scrollbars */
      display: flex;
      flex-direction: column;
      background: #222;
    }

    /* 2. Blue bar at very top */
    body {
      border-top: 10px solid #006BFF;
      border-bottom: 45px solid #222;
    }

    /* 3. Header with your gallery title */
    header {
      flex: 0 0 auto;              /* fixed height */
      padding: 1rem 2rem;
      color: #eee;
      font-family: 'Michroma', sans-serif;
      font-size: 2rem;
      margin: 5;
    }

    /* 4. Gallery takes all remaining space */
    .gallery {
      flex: 1 1 auto;              /* fill vertical leftover */
      margin: 0;
      font-family: 'Michroma', sans-serif;
      display: grid;
      grid-template-columns: 1.75fr 2fr 1.5fr;
      grid-template-rows:    1fr   1fr;
      gap: 1px;
      width: 95vw;
      
      /* height no longer needed—flex handles it */
      margin: 0 auto;              /* center horizontally */
    }

    /* 5. Common scaling for media */
    .gallery video,
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .wrapper {
        width: var(--gallery-width);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
      }

    /* 6. Place each item explicitly */
    .image {
      grid-column: 1;
      grid-row: 1 / 3;
    }
    .video1 {
      grid-column: 2;
      grid-row: 1;
    }
    .video2 {
      grid-column: 2;
      grid-row: 2;
    }
    .portrait {
      grid-column: 3;
      grid-row: 1 / 3;
    }
  </style>
</head>
<body>
  <div class="wrapper">
  <!-- your page header -->
  <header><b> Hexy: Media Gallery </b></header>

  <!-- the grid of images/videos -->
  <div class="gallery">
    <img    src="pushup2.jpeg"      alt="" class="image">
    <video src="Videos/Park.mp4"    muted autoplay loop playsinline class="video1"></video>
    <video src="Videos/map1.mp4"    muted autoplay loop playsinline class="video2"></video>
    <video src="Videos/Indoor.mp4"  muted autoplay loop playsinline class="portrait"></video>
  </div>
</div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.portrait').playbackRate = 1.5;
    });
  </script>
</body>
</html>
