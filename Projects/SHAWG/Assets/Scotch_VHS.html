<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scotch Videocassette EG T 120</title>

  <!-- Google Fonts import -->
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap");

    :root {
      --dark-color: #191f1d;
      --mid-dark: #555a57;
      --light-color: #ece0c8;
      --mid-light: #949993;
      --shadow: #0005;
      --linear-rainbow: linear-gradient(
        to right,#ede6bf,#ecc947,#cb5a31,#6f5d79,#4e779a
      );
      --circle-rainbow: radial-gradient(
        circle at left top,#ede6bf,#ecc947,#cb5a31,#6f5d79,#4e779a
      );
      --noise-texture: url(https://i.gyazo.com/a26366e538851a5c569ff648e99b7fd4.png);
      --gif-texture: url(https://64.media.tumblr.com/da60c13b478dda09ab90c27e880983b8/tumblr_nd4pwdPKdc1tun3l0o1_1280.gifv);
      --mulish: "Mulish", sans-serif;
      --playfair: "Playfair Display", serif;
      --dm:"DM Serif Display", serif;
      --main-transition: all 0.2s ease-in-out;
    }

    html, body {
      margin: 0;
      height: 100vh;
    }

    body {
      display: grid;
      place-items: center;
      background: var(--dark-color) var(--noise-texture) overlay;
    }

    h1 {
      margin: 0;
      font-family: var(--mulish);
      font-weight: 1000;
      font-size: 64px;
      color: var(--light-color);
    }

    h2 {
      margin: 0;
      font-family: var(--playfair);
      font-size: 16px;
      color: var(--mid-light);
    }

    h3 {
      margin: 0;
      font-family: var(--dm);
      font-size: 24px;
      color: var(--mid-light);
    }

    p {
      font-family: var(--mulish);
      font-weight: 700;
      width: 390px;
      color: var(--mid-light);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: end;
      margin: 30px 128px;
      gap: 48px;
      font-size: 16px;
    }

    a {
      margin: 0;
      padding: 0;
      font-size: 12px;
      font-family: var(--mulish);
      color: var(--mid-light);
      font-weight: 400;
      text-decoration: none;
      transition: var(--main-transition);
    }

    a:not(.buy, .buy-cta, .learn) {
      width: 64px;
    }

    a:hover:not(.buy, .buy-cta, .learn) {
      font-weight: 900;
      text-shadow: 0 0 8px var(--light-color);
    }

    .scotch-container {
      display: grid;
      width: 960px;
      height: 580px;
      background-image: linear-gradient(
        150deg,
        var(--dark-color) 60.2%,
        var(--mid-dark) 60.28%,
        var(--mid-dark) 60.7%,
        var(--dark-color) 60.78%,
        var(--dark-color) 61.4%,
        var(--mid-dark) 61.48%,
        var(--mid-dark) 62.6%,
        var(--dark-color) 62.68%,
        var(--dark-color) 63.4%,
        var(--mid-dark) 63.48%,
        var(--mid-dark) 64.6%,
        var(--dark-color) 64.68%,
        var(--dark-color) 65.4%,
        var(--mid-dark) 65.48%,
        var(--mid-dark) 67.4%,
        var(--dark-color) 67.48%,
        var(--dark-color) 68.4%,
        var(--mid-dark) 68.48%,
        var(--mid-dark) 71.4%,
        var(--dark-color) 71.48%,
        var(--dark-color) 72.4%,
        var(--mid-dark) 72.48%,
        var(--mid-dark) 76.4%,
        var(--dark-color) 76.48%,
        var(--dark-color) 77.4%,
        var(--mid-dark) 77.48%,
        var(--mid-dark) 81.4%,
        var(--dark-color) 81.48%,
        var(--dark-color) 82.4%,
        var(--mid-dark) 82.48%,
        var(--mid-light) 87.4%,
        var(--dark-color) 87.48%
      );
      position: relative;
      animation: spawn 2s ease-in-out forwards;
    }

    .scotch-container::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: var(--noise-texture);
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 3;
    }

    .scotch-container:hover::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: var(--gif-texture);
      background-repeat: no-repeat;
      background-position-y: -20px;
      background-size: cover;
      mix-blend-mode: screen;
      opacity: 0.64;
      pointer-events: none;
      z-index: 3;
    }

    .main-container {
      margin: auto;
      display: grid;
      height: 460px;
      gap: 64px;
      place-items: center;
    }

    .text-sphere-container {
      display: flex;
      width: 125%;
      gap: 128px;
      align-items: center;
    }

    .text-container {
      display: flex;
      flex-direction: column;
    }

    .sphere {
      width: 200px;
      height: 200px;
      background-image: var(--circle-rainbow);
      border: 3px solid var(--dark-color);
      border-radius: 50%;
      box-shadow: 0 0 var(--shadow);
      transition: all 0.4s;
    }
    .sphere:hover {
      transform: scale(1.1);
      box-shadow: 16px 16px var(--shadow);
    }

    .buy {
      display: grid;
      place-items: center;
      width: 128px;
      height: 40px;
      border: 1px solid var(--mid-light);
      font-weight: 900;
      transition: var(--main-transition);
    }
    .buy:hover {
      transform: scale(1.1) rotate(-2deg);
      background: var(--light-color);
      color: var(--dark-color);
      border-color: var(--light-color);
    }

    .buy-cta {
      display: grid;
      place-items: center;
      width: 200px;
      height: 40px;
      font-size: 16px;
      font-weight: 900;
      background-image: linear-gradient(to right, var(--light-color), var(--light-color));
      color: var(--dark-color);
      transition: var(--main-transition);
    }
    .buy-cta:hover {
      transform: scale(1.1) rotate(2deg);
      background-image: var(--linear-rainbow);
      color: var(--light-color);
    }

    .learn-arrow {
      text-align: center;
      margin-top: -40px;
      transition: var(--main-transition);
    }

    .learn {
      font-family: var(--mulish);
      font-size: 12px;
      color: var(--light-color);
      cursor: pointer;
      transition: var(--main-transition);
    }
    .learn:hover {
      transform: scale(1.2);
      font-weight: 900;
    }

    .arrow {
      font-size: 32px;
      margin-top: -6px;
      color: var(--light-color);
    }

    @keyframes spawn {
      from {
        box-shadow: 0 0 0 var(--shadow);
        opacity: 0;
      }
      to {
        box-shadow: 0 0 32px var(--shadow);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <section class="scotch-container">
    <nav>
      <a href="#">CONTACT</a>
      <a href="#">ABOUT</a>
      <a href="https://www.amazon.com/-/es/Scotch-Cinta-blanco-T-120-est%C3%A1ndar/dp/B008C7Z54Y" class="buy" target="_blank">BUY NOW</a>
    </nav>

    <article class="main-container">
      <div class="text-sphere-container">
        <hgroup class="text-container">
          <h1>Scotch</h1>
          <h2>VIDEOCASSETTE EG</h2>
          <h3>T 120</h3>
          <p>Designed by the inventors of videotape, this Scotch EG Videocasette gives your superior performance</p>
          <a href="https://www.amazon.com/-/es/Scotch-Cinta-blanco-T-120-est%C3%A1ndar/dp/B008C7Z54Y" class="buy-cta" target="_blank">Buy Now</a>
        </hgroup>
        <a href="https://www.amazon.com/-/es/Scotch-Cinta-blanco-T-120-est%C3%A1ndar/dp/B008C7Z54Y">
          <div class="sphere"></div>
        </a>
      </div>
      <footer class="learn-arrow">
        <div class="learn">LEARN MORE</div>
        <div class="arrow">🢓</div>
      </footer>
    </article>
  </section>
</body>
</html>
