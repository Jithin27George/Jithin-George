  <style>
    /* page reset & dark background */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: #1c1d22;
      color: #fff;
      font-family: sans-serif;
    }
    /* fixed blue stripe */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 7px;
      background: #006BFF;
      z-index: 1000;
    }
    /* push everything below that stripe */
    body {
      padding-top: 7px;
    }
    /* container to center everything */
    .container {
      width: 90vw; 
      max-width: 2500px;
      margin: auto;
      text-align: center;
      margin-top: -4px;
    }

    /* heading */
    h1 {
      font-family: 'Michroma', sans-serif;
      font-size: clamp(2rem, 10vw, 5rem);
      margin: 1rem 0;
    }
    

    /* horizontal row of images */
    .image-row {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .image-container {
      position: relative;
      flex: 1;
    }

    /* make the image fill its container */
    .image-container img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;      /* preserve your rounding */
      object-fit: cover;
    }

    /* all hotspots share this base style */
    .hotspot {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(225,225,225,0.01);
      cursor: pointer;
      transform: translate(-50%, -50%); /* center the dot exactly at the point */
    }

    /* info‐box under the images */
    #info-box {
      font-family: 'Inter', sans-serif;
      margin-top: 2rem;
      background: #111;
      color: #0ff;
      padding: 1rem;
      min-height: 27px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }

    #info-box.default {
      font-family: 'Monoid', monospace;
      justify-content: flex-start;
      text-align: left;
      padding-left: 1rem;
    }

    /* THIS is the one that actually shrinks the text */
    #info-box.default h2 {
      font-size: 0.75rem;
      color: #0ff;
    }

    /* base holographic card style (tweaked for a small info‐box) */
    .holographic-card {
      position: relative;
      overflow: hidden;
      border-radius: 15px;
      background: #111;
      padding: 1rem 2rem;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 300px;
      transition: all 0.5s ease;
    }

    /* the <h2> inside: default & active text styling */
    .holographic-card h2 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-family: 'Inter', sans-serif;
      color: #0ff;
      font-size: 1.25rem;
    }

    /* the moving shimmer */
    .holographic-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        0deg, 
        transparent, 
        transparent 30%, 
        rgba(0,255,255,0.3)
      );
      transform: rotate(-45deg);
      transition: all 0.5s ease;
      opacity: 0;
    }

    /* when active, we pulse & show the shimmer */
    .holographic-card.active {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0,255,255,0.5);
    }

    .holographic-card.active::before {
      opacity: 1;
      transform: rotate(-45deg) translateY(100%);
    }

    /* override for the “default” prompt style */
    .holographic-card.default h2 {
      font-family: 'Courier New', monospace;
      color: #f66;
      font-size: 1.5rem;
    }

    /* small media‐query to stack on very narrow screens */
    @media (max-width: 600px) {
      .image-row {
        flex-direction: column;
      }
      .image-container {
        margin-bottom: 1rem;
      }
      /*.hotspot {
        /* you may also need to re-tweak these at small sizes 
      }*/
    }

  <script>
    // reposition dots on load/resize
    function positionHotspots() {
      document.querySelectorAll('.image-container').forEach(container => {
        const img = container.querySelector('img');
        const { width, height } = img.getBoundingClientRect();
  
        container.querySelectorAll('.hotspot').forEach(hs => {
          const x = parseFloat(hs.dataset.x);
          const y = parseFloat(hs.dataset.y);
          hs.style.left = (x * 100) + '%';
          hs.style.top  = (y * 100) + '%';
        });
      });
    }
    window.addEventListener('load',  positionHotspots);
    window.addEventListener('resize', positionHotspots);
  
    // now the hover logic
    window.addEventListener('DOMContentLoaded', () => {
      const infoBox    = document.getElementById('info-box');
      const heading    = infoBox.querySelector('h2');
      const defaultText = heading.textContent;
  
      document.querySelectorAll('.hotspot').forEach(hs => {
        hs.addEventListener('mouseenter', () => {
          infoBox.classList.remove('default');
          infoBox.classList.add('active');
          heading.textContent = hs.dataset.label;
        });
        hs.addEventListener('mouseleave', () => {
          infoBox.classList.remove('active');
          infoBox.classList.add('default');
          heading.textContent = defaultText;
        });
          // ── touch support ──
        hs.addEventListener('touchstart', e => {
          e.preventDefault();               // avoid firing mouse events afterward
          infoBox.classList.remove('default');
          infoBox.classList.add('active');
          heading.textContent = hs.dataset.label;
        }, { passive: false });
        hs.addEventListener('touchend', () => {
          infoBox.classList.remove('active');
          infoBox.classList.add('default');
          heading.textContent = defaultText;
        });
      });
      
    });
  </script>
