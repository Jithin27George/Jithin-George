<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jithin George | Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f4f4f4;
      color: #333;
    }
    h1 {
      text-align: center;
      font-size: 2.5rem;
    }
    .about {
      max-width: 700px;
      margin: 2rem auto;
      background: #ffffff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .about img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 1rem;
    }
    .repo {
      background: #fff;
      border-radius: 8px;
      margin: 1rem auto;
      padding: 1rem 1.5rem;
      max-width: 700px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .repo a {
      font-size: 1.2rem;
      font-weight: bold;
      color: #0366d6;
      text-decoration: none;
    }
    .repo p {
      margin: 0.5rem 0 0;
    }
  </style>
</head>
<body>
  <h1>My GitHub Projects</h1>

  <div class="about">
    <img src="https://avatars.githubusercontent.com/u/12345678?v=4" alt="Profile Picture">
    <h2>Jithin George</h2>
    <p>Mechanical Design Engineer & Robotics Enthusiast</p>
    <p><a href="mailto:jg7688@nyu.edu">Email Me</a> | <a href="https://www.linkedin.com/in/jithin27george" target="_blank">LinkedIn</a></p>
  </div>

  <div id="repo-list">Loading repositories...</div>

  <script>
    const username = "Jithin27George";
    const repoList = document.getElementById("repo-list");

    fetch(`https://api.github.com/users/${username}/repos?sort=updated`)
      .then(res => res.json())
      .then(repos => {
        repoList.innerHTML = "";
        repos.forEach(repo => {
          const div = document.createElement("div");
          div.className = "repo";
          div.innerHTML = `
            <a href="${repo.html_url}" target="_blank">${repo.name}</a>
            <p>${repo.description || "No description provided."}</p>
          `;
          repoList.appendChild(div);
        });
      })
      .catch(err => {
        repoList.innerHTML = "<p>Failed to load repositories.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
